<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#081726">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Pokémon Heart &amp; Soul">
  <meta name="description" content="An offline-friendly field guide for Pokémon Heart &amp; Soul v2.0.2.">
  <meta property="og:title" content="Pokémon Heart &amp; Soul Field Guide">
  <meta property="og:description" content="Explore Pokémon, encounters, moves, items and team planning.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/art/steamgriddb-heart-soul-hero.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Pokémon Heart &amp; Soul Field Guide">
  <meta name="twitter:description" content="Explore Pokémon, encounters, moves, items and team planning.">
  <meta name="twitter:image" content="assets/art/steamgriddb-heart-soul-hero.png">
  <title>Pokémon Heart &amp; Soul Field Guide</title>
  <link rel="icon" type="image/png" sizes="192x192" href="assets/art/heart-soul-app-icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/art/apple-touch-icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="assets/art/apple-touch-icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="assets/art/apple-touch-icon-152.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="refinements.css?v=2.0.2-5">
  <script src="config/game-config.js?v=2.0.2-5"></script>
  <script src="config/game-overrides.js?v=2.0.2-7"></script>
  <script src="sync-config.js?v=2.0.2-5"></script>
</head>
<body>
  <header class="topbar">
    <button class="brand" data-view="home" aria-label="Go to overview">
      <img class="brand-logo" src="assets/art/steamgriddb-heart-soul-logo.png" alt="">
      <span><strong>Field Guide</strong></span>
    </button>
    <div class="global-search-wrap">
      <label class="global-search"><span>⌕</span><input id="globalSearch" type="search" placeholder="Search the whole guide…" autocomplete="off" aria-controls="universalResults" aria-expanded="false"><kbd>/</kbd></label>
      <div id="universalResults" class="universal-results" hidden></div>
    </div>
    <button class="progress-pill" data-view="progress"><span id="headerProgress">0%</span><b>My Dex</b></button>
  </header>
  <div class="shell">
    <aside class="sidebar">
      <nav>
        <button class="active" data-view="home"><img class="nav-sprite" src="assets/items/exp-candy-xl.png" alt="">Overview</button>
        <button data-view="pokedex"><img class="nav-sprite" src="assets/items/poke-radar.png" alt="">Pokédex</button>
        <button data-view="moves"><img class="nav-sprite" src="assets/items/tm-case.png" alt="">Moves</button>
        <button data-view="items"><img class="nav-sprite" src="assets/items/prop-case.png" alt="">Items</button>
        <button data-view="locations"><img class="nav-sprite" src="assets/items/old-sea-map.png" alt="">Locations</button>
        <button data-view="team"><img class="nav-sprite" src="assets/items/poke-ball.png" alt="">Team Builder</button>
        <button data-view="future"><img class="nav-sprite" src="assets/item-dex/1.png" alt="">Future Team</button>
        <button data-view="favorites"><img class="nav-sprite" src="assets/items/heart-scale.png" alt="">Favorites</button>
        <button data-view="battle"><img class="nav-sprite" src="assets/items/vs-seeker.png" alt="">Battles</button>
        <button data-view="trainer"><img class="nav-sprite" src="assets/items/adventure-guide.png" alt="">Trainer</button>
        <button data-view="progress"><img class="nav-sprite" src="assets/items/adventure-guide.png" alt="">Progress</button>
        <button data-view="save"><img class="nav-sprite" src="assets/items/card-key.png" alt="">Save &amp; Sync</button>
      </nav>
      <div class="source-card"><small>OFFICIAL v2.0.2 DATA</small><p>Generated from the pinned Heart &amp; Soul release source and official documentation. Full provenance is recorded in <code>sources/source-inventory.md</code>.</p></div>
    </aside>
    <main id="mainContent" tabindex="-1"></main>
  </div>
  <nav class="mobile-nav"><button data-view="home"><img class="nav-sprite" src="assets/items/exp-candy-xl.png" alt=""><small>Home</small></button><button data-view="pokedex"><img class="nav-sprite" src="assets/items/poke-radar.png" alt=""><small>Dex</small></button><button data-view="moves"><img class="nav-sprite" src="assets/items/tm-case.png" alt=""><small>Moves</small></button><button data-view="items"><img class="nav-sprite" src="assets/items/prop-case.png" alt=""><small>Items</small></button><button data-view="locations"><img class="nav-sprite" src="assets/items/old-sea-map.png" alt=""><small>Places</small></button><button data-view="team"><img class="nav-sprite" src="assets/items/poke-ball.png" alt=""><small>Team</small></button><button data-view="future"><img class="nav-sprite" src="assets/item-dex/1.png" alt=""><small>Future</small></button><button data-view="favorites"><img class="nav-sprite" src="assets/items/heart-scale.png" alt=""><small>Saved</small></button><button data-view="battle"><img class="nav-sprite" src="assets/items/vs-seeker.png" alt=""><small>Battles</small></button><button data-view="trainer"><img class="nav-sprite" src="assets/items/adventure-guide.png" alt=""><small>Trainer</small></button><button data-view="progress"><img class="nav-sprite" src="assets/items/adventure-guide.png" alt=""><small>Progress</small></button><button data-view="save"><img class="nav-sprite" src="assets/items/card-key.png" alt=""><small>Sync</small></button></nav>
  <dialog id="detailDialog"><div id="dialogContent"></div></dialog>
  <dialog id="profileSetupDialog" aria-labelledby="profileSetupTitle"></dialog>
  <button id="jumpTop" aria-label="Jump to top">↑</button>
  <div id="toast" aria-live="polite"></div>
  <script src="data/guide-data.js?v=2.0.2-6"></script>
  <script src="data/items-data.js?v=2.0.2-2"></script>
  <script src="data/legendary-data.js?v=2.0.2-2"></script>
  <script src="data/acquisition-data.js?v=2.0.2-2"></script>
  <script src="data/egg-data.js?v=2.0.2-2"></script>
  <script src="data/battle-data.js?v=2.0.2-5"></script>
  <script src="data/move-tutor-data.js?v=2.0.2-2"></script>
  <script src="data/curated-builds.js?v=2.0.2-2"></script>
  <script src="app.js?v=2.0.2-7"></script>
  <script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));</script>
</body>
</html>
